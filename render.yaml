services:
  - type: web
    name: votamas-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_SCHEMA
        value: vota_mas
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_INITIAL_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MAX_IDLE_MINUTES
        value: "5"
      - key: DB_POOL_ACQUIRE_TIMEOUT_SECONDS
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: votamas-api
      - key: JWT_EXPIRATION_MS
        value: "900000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: IMPORT_MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: IMPORT_MAX_ROWS
        value: "5000"
      - key: EXPORT_MAX_ROWS
        value: "10000"
