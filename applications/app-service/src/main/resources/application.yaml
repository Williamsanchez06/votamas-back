server:
  port: ${PORT:8080}
spring:
  application:
    name: "votamas"
  devtools:
    add-properties: false
  webflux:
    multipart:
      max-in-memory-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:votamas}
    schema: ${DB_SCHEMA:vota_mas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    ssl: ${DB_SSL:false}
    initial-size: ${DB_POOL_INITIAL_SIZE:0}
    max-size: ${DB_POOL_MAX_SIZE:5}
    max-idle-time-minutes: ${DB_POOL_MAX_IDLE_MINUTES:5}
    max-acquire-time-seconds: ${DB_POOL_ACQUIRE_TIMEOUT_SECONDS:10}
jwt:
  secret: ${JWT_SECRET:hh_clave_super_william_de_reppppp_32_232DFE}
  expiration: ${JWT_EXPIRATION_MS:900000}
  issuer: ${JWT_ISSUER:votamas-api}
entries:
  reactive-web:
    base-path-api: "/api/v1"
imports:
  potential-voters:
    max-file-size-bytes: ${IMPORT_MAX_FILE_SIZE_BYTES:10485760}
    max-rows: ${IMPORT_MAX_ROWS:5000}
exports:
  potential-voters:
    max-rows: ${EXPORT_MAX_ROWS:10000}
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}
  expire-after-access: ${RATE_LIMIT_EXPIRE_AFTER_ACCESS:10m}
  default-policy:
    limit-for-period: ${RATE_LIMIT_DEFAULT_LIMIT_FOR_PERIOD:100}
    limit-refresh-period: ${RATE_LIMIT_DEFAULT_LIMIT_REFRESH_PERIOD:1m}
  login-policy:
    limit-for-period: ${RATE_LIMIT_LOGIN_LIMIT_FOR_PERIOD:5}
    limit-refresh-period: ${RATE_LIMIT_LOGIN_LIMIT_REFRESH_PERIOD:1m}
  import-policy:
    limit-for-period: ${RATE_LIMIT_IMPORT_LIMIT_FOR_PERIOD:2}
    limit-refresh-period: ${RATE_LIMIT_IMPORT_LIMIT_REFRESH_PERIOD:1m}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
